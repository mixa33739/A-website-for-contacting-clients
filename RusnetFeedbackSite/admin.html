<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 0.95rem;
        }
        .admin-table th,
        .admin-table td {
            padding: 12px 15px;
            text-align: left;
            vertical-align: middle;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .admin-table th {
            background-color: rgba(52, 152, 219, 0.15);
            color: #3498db;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }
        .problem-description {
            max-width: 250px;
            white-space: normal;
            word-wrap: break-word;
            line-height: 1.4;
        }
        .admin-table tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }
        .btn-save {
            padding: 6px 12px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-save:hover {
            background: #2ecc71;
        }
    </style>
    <title>Панель администратора | АНО «Руснэт»</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
    <div class="container header-content">
        <div class="logo">
            <img src="img/rusnet-logo.png" alt="Логотип Руснэт" onerror="this.style.display='none'">
        </div>
        <nav class="nav-menu">
            <span style="color: var(--text-gray); margin-right: 15px;">Режим: Администратор</span>
            <a href="login.html" style="color: #e74c3c;">Выйти</a>
        </nav>
    </div>
</header>
<main class="dashboard-page-wrapper">
    <div class="dashboard-card" style="max-width: 1000px;">
        <h2>Панель управления обращениями</h2>
        <p class="subtitle">Все заявки от пользователей</p>
        <div class="admin-table-container">
            <table class="admin-table">
                <thead>
                <tr><th>ID</th><th>Дата</th><th>Сайт</th><th>Проблема</th><th>Статус</th><th>Действие</th></tr>
                </thead>
                <tbody id="adminTicketsBody">
                </tbody>
            </table>
        </div>
    </div>
</main>
<script src="api.js"></script>
<script>
    if (!localStorage.getItem('token')) window.location.href = 'login.html';
    document.addEventListener('DOMContentLoaded', loadAdminTickets);
    async function loadAdminTickets() {
    try {
    const data = await fetchAuth('/tickets');
    renderAdminTable(data.tickets);
    } catch (error) {
    console.error('Ошибка загрузки:', error);
    }
    }
    function renderAdminTable(tickets) {
    const tbody = document.getElementById('adminTicketsBody');
    tbody.innerHTML = '';
    if (tickets.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;">Заявок нет</td></tr>';
    return;
    }
    tickets.forEach(ticket => {
    const row = document.createElement('tr');
    row.innerHTML = `
    <td>${ticket.id}</td>
    <td>${new Date(ticket.created_at).toLocaleString()}</td>
    <td>${ticket.site.name}</td>
    <td class="problem-description" title="${ticket.description}">${ticket.description}</td>
    <td>
    <select onchange="updateStatus(${ticket.id}, this.value)"
    class="status-select status-${ticket.status.name.toLowerCase().replace(' ', '-')}">
    <option value="Новое" ${ticket.status.name === 'Новое' ? 'selected' : ''}>Новое</option>
    <option value="В работе" ${ticket.status.name === 'В работе' ? 'selected' : ''}>В работе</option>
    <option value="Решено" ${ticket.status.name === 'Решено' ? 'selected' : ''}>Решено</option>
    <option value="Закрыто" ${ticket.status.name === 'Закрыто' ? 'selected' : ''}>Закрыто</option>
    </select>
    </td>
    <td><button class="btn-save" onclick="updateStatus(${ticket.id}, this.previousElementSibling.value)">Сохранить</button></td>
    `;
    tbody.appendChild(row);
    });
    }
</script>
</body>
</html>
